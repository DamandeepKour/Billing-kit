name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Security: check for secrets (repo + package output)
        run: npm run security:check

      - name: Release safety checks
        run: npm run release:check

      - name: Validate package contents (npm pack)
        run: npm run validate:pack

      - name: Upload packed tarball (Node 22)
        if: matrix.node-version == '22.x'
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          ls -la artifacts
        # Inspect CI artifacts before cutting a release tag.

      - name: Persist npm pack artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: billing-kit-pack
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
