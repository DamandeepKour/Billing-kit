# Publishes billing-kit to npm with OIDC trusted publishing + provenance,
# then creates a GitHub Release from the matching CHANGELOG section.
# One-time setup on npmjs.com → Package → Settings → Trusted Publisher:
#   Provider: GitHub Actions
#   Organization/user: DamandeepKour
#   Repository: Billing-kit
#   Workflow filename: publish.yml
# Optional: add a GitHub Environment named "npm" with required reviewers.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Create GitHub Release for the tag
  id-token: write # Required for npm OIDC / provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Do not cache package manager state for release builds

      - name: Verify tag matches package.json version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing billing-kit@$PKG from tag v$TAG"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Release safety checks (require changelog section)
        run: npm run release:check -- --release

      - name: Lint, typecheck, test, build, pack validation
        run: npm run ci

      - name: Inspect package contents (npm pack --dry-run)
        # Last human-readable checkpoint before publish — the tarball listing
        # for this exact commit/version, visible in the log a reviewer sees
        # before approving the "npm" environment gate below.
        run: npm pack --dry-run

      - name: Publish with provenance
        # Trusted publishing exchanges a short-lived OIDC token — no NPM_TOKEN secret.
        # Provenance attestations are generated automatically for public repos.
        run: npm publish --access public --provenance

      - name: Extract CHANGELOG notes for this version
        run: |
          node scripts/extract-changelog.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --out release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          body_file: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
